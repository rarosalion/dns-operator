name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: none of these jobs need to write anything back to the repo (no PR comments, no
# releases, no packages) - the default token grant otherwise ends up broader than that, especially
# on a `pull_request` trigger where the token can come from a forked PR's context.
permissions:
  contents: read

jobs:
  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          args: check operator/

  lint-chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - run: helm lint ./chart

  build-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t dns-operator:ci .
