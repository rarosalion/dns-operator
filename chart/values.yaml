image:
  repository: ghcr.io/rarosalion/dns-operator
  tag: "0.1.4"

namespace: dns-operator

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

opnsense:
  host: https://opnsense.example.com
  verifyTLS: true
  # The operator refuses a non-https host (Basic auth over plain HTTP puts the API key/secret on
  # the wire in cleartext) unless this is explicitly set. Only for a lab/test instance you
  # genuinely can't put behind TLS - never for anything that carries real credentials.
  allowInsecureTransport: false
  # Credentials for a dedicated OPNsense API user, granted only the "Services: Unbound DNS"
  # privilege - nothing else. Set via --set or a separate values file kept out of git, or wire to
  # your secret manager of choice via whatever templating your deploy pipeline already uses.
  apiKey: ""
  apiSecret: ""
  # Name of a pre-existing Secret (with "key"/"secret" data keys) to use instead of apiKey/
  # apiSecret above. Leave unset to have this chart render its own Secret from apiKey/apiSecret -
  # set this when your credentials are already managed by an external secret manager (Vault,
  # Sealed Secrets, SOPS, External Secrets, ...) so they never need to pass through Helm values,
  # `--set` shell history, or CI logs.
  existingSecret: ""
  # Minimum seconds between real Unbound reconfigure/reload calls. Every alias create/update/
  # delete triggers one, and any tenant with create rights on Ingress/DNSAlias can trigger those -
  # this caps how often a burst of churn can force Unbound to reload, without ever skipping a
  # reload a mutation actually needs (callers block until their turn instead).
  reconfigureMinIntervalSeconds: 5

dns:
  # Domains this operator is allowed to create aliases in. Anything outside this list is rejected,
  # even if requested via a DNSAlias CR or an Ingress annotation.
  allowedDomains:
    - apps.example.internal

  # Existing OPNsense host overrides this operator is allowed to point aliases at (e.g. your
  # ingress controller's VIP, already set up as its own host override). It never creates a host
  # override (an A record) itself - only aliases attached to one of these.
  allowedTargets:
    - ingress.apps.example.internal

  # Used when a DNSAlias or Ingress doesn't specify its own target. Must be one of allowedTargets.
  defaultTarget: ingress.apps.example.internal

  # When true, a pre-existing alias that isn't operator-managed gets adopted (re-tagged as owned by
  # the requesting resource) instead of rejected - but only if it already points at the requested
  # target. Off by default: adopting a hand-made record changes what "deleting this resource" does
  # to it (the operator will now delete it too), which is worth opting into deliberately rather
  # than getting by default.
  adoptUnmanaged: false
