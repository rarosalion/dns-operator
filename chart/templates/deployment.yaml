apiVersion: apps/v1
kind: Deployment
metadata:
  name: dns-operator
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  # minReadySeconds holds a new pod out of "available" until it has stayed up, so a pod that
  # starts and then crashes never gets the old one torn down under it.
  minReadySeconds: 30
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: dns-operator
  template:
    metadata:
      labels:
        app: dns-operator
    spec:
      serviceAccountName: dns-operator
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: health
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
            - name: OPNSENSE_HOST
              value: {{ .Values.opnsense.host | quote }}
            - name: OPNSENSE_VERIFY_TLS
              value: {{ .Values.opnsense.verifyTLS | quote }}
            - name: OPNSENSE_ALLOW_INSECURE_TRANSPORT
              value: {{ .Values.opnsense.allowInsecureTransport | quote }}
            - name: OPNSENSE_RECONFIGURE_MIN_INTERVAL
              value: {{ .Values.opnsense.reconfigureMinIntervalSeconds | quote }}
            - name: OPNSENSE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.opnsense.existingSecret | default "opnsense-api" }}
                  key: key
            - name: OPNSENSE_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.opnsense.existingSecret | default "opnsense-api" }}
                  key: secret
            - name: DNS_ALLOWED_DOMAINS
              value: {{ .Values.dns.allowedDomains | join "," | quote }}
            - name: DNS_ALLOWED_TARGETS
              value: {{ .Values.dns.allowedTargets | join "," | quote }}
            - name: DNS_DEFAULT_TARGET
              value: {{ .Values.dns.defaultTarget | quote }}
            - name: DNS_ADOPT_UNMANAGED
              value: {{ .Values.dns.adoptUnmanaged | quote }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # readOnlyRootFilesystem above means anything under the container's own filesystem (e.g.
        # a library that wants a scratch/lock file, or bytecode caching) needs a writable mount -
        # this operator otherwise carries no persistent state, so an emptyDir is enough.
        - name: tmp
          emptyDir: {}
