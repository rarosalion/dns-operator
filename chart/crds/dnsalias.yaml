apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: dnsaliases.dns.rarosalion.github.io
spec:
  group: dns.rarosalion.github.io
  scope: Namespaced
  names:
    plural: dnsaliases
    singular: dnsalias
    kind: DNSAlias
    shortNames:
      - dnsa
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Hostname
          type: string
          jsonPath: .spec.hostname
        - name: Domain
          type: string
          jsonPath: .spec.domain
        - name: Target
          type: string
          jsonPath: .spec.target
        - name: Ready
          type: boolean
          jsonPath: .status.ready
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [hostname, domain]
              properties:
                hostname:
                  type: string
                  description: The alias's hostname label, e.g. "myapp".
                  maxLength: 63
                  # A single DNS label - notably excludes "*". Without this, a wildcard hostname
                  # in an otherwise-allowed domain would pass admission and let one tenant claim
                  # every unclaimed name in that domain (the operator's own validation in
                  # dns_alias.py rejects this too, defense in depth).
                  pattern: '^[A-Za-z0-9]([A-Za-z0-9_-]{0,61}[A-Za-z0-9])?$'
                domain:
                  type: string
                  description: The alias's domain. Must be one of the operator's configured allowed domains.
                  maxLength: 253
                  pattern: '^[A-Za-z0-9]([A-Za-z0-9_-]{0,61}[A-Za-z0-9])?(\.[A-Za-z0-9]([A-Za-z0-9_-]{0,61}[A-Za-z0-9])?)*$'
                target:
                  type: string
                  description: >-
                    FQDN of the existing OPNsense host override to alias to. Must be one of the
                    operator's configured allowed targets. Defaults to the operator's configured
                    default target when omitted.
                  maxLength: 253
                  pattern: '^[A-Za-z0-9]([A-Za-z0-9_-]{0,61}[A-Za-z0-9])?(\.[A-Za-z0-9]([A-Za-z0-9_-]{0,61}[A-Za-z0-9])?)+$'
            status:
              type: object
              properties:
                ready:
                  type: boolean
                message:
                  type: string
                observedGeneration:
                  type: integer
